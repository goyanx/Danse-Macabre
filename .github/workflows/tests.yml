name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    env:
      RENPY_VERSION: "8.3.7"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run offline regression suite
        run: python tools/run_tests.py

      - name: Cache Ren'Py SDK
        id: cache-renpy
        uses: actions/cache@v4
        with:
          path: .renpy-sdk
          key: renpy-sdk-${{ runner.os }}-${{ env.RENPY_VERSION }}

      - name: Download Ren'Py SDK
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "renpy-sdk.zip"
          $url = "https://www.renpy.org/dl/$env:RENPY_VERSION/renpy-$env:RENPY_VERSION-sdk.zip"
          Invoke-WebRequest $url -OutFile $archive
          Expand-Archive $archive -DestinationPath ".renpy-sdk"

      - name: Boot Ren'Py and verify initialized UI and voice playback
        shell: pwsh
        env:
          RENPY_RENDERER: angle2
          SDL_AUDIODRIVER: dummy
        run: |
          python tools/run_tests.py --skip-unit --voice-init --renpy-exe ".renpy-sdk\renpy-${{ env.RENPY_VERSION }}-sdk\renpy.exe"
          if ($LASTEXITCODE -ne 0) {
            Get-Content log.txt -ErrorAction SilentlyContinue
            Get-Content traceback.txt -ErrorAction SilentlyContinue
            exit $LASTEXITCODE
          }
